name: ci

# Everything that judges a pull request: the gate on three platforms, the commit messages, the
# workflow linters and the advisory check. The three shared jobs call the reusable workflows in
# zachthedev/.github, pinned by commit with the release's version beside the pin.
on:
  # Every pull request, whatever it targets. A stacked pull request is based on the layer
  # below it, and a base filter would leave each middle layer with no checks.
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gate a contributor runs locally, called and never restated. `go tool task --list`
  # prints every task with what it checks. Its tools task asserts mise.lock against mise.toml
  # and then installs, in that order by construction, and the race leg runs for real on every
  # runner image, because each ships a C compiler.
  gate:
    strategy:
      # One platform failing still reports the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain go.mod names. The action verifies no download, so that pin plus the
      # cooldown is the control.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # packageManager in package.json is the one Bun pin, for commitlint and Prettier.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # mise alone, verified against the release's signed checksums. install: false, because
      # the gate asserts mise.lock before it installs from it, and an install here would put
      # the bytes on disk before the assertions read the file. cache: false for the same
      # reason: nothing restored ahead of the assertions.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install: false
          cache: false
      # GH_TOKEN, so the gate's zizmor runs online here as it does for a contributor whose
      # gh auth token succeeds. The job token is read-only.
      - run: go tool task check
        env:
          GH_TOKEN: ${{ github.token }}

  # The three pins below are filled from the first zachthedev/.github release. Renovate moves
  # them after that. A called workflow's job gets at most what its caller grants here, so each
  # job grants what the called job declares: a checkout and the read-only audits, nothing more.
  commits:
    permissions:
      contents: read
    uses: zachthedev/.github/.github/workflows/commits.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0

  workflows:
    permissions:
      contents: read
    uses: zachthedev/.github/.github/workflows/workflows.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0

  # A waived advisory is passed as `with: allow-ghsas:` here, with a comment beside it naming the
  # advisory, what it blocks, why shipping is safer and the condition that removes it.
  dependency-review:
    permissions:
      contents: read
    uses: zachthedev/.github/.github/workflows/dependency-review.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0

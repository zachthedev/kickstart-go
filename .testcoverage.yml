# Coverage enforcement via go-test-coverage, a tool directive in go.mod.
# Run: go tool task coverage
#
# Per-package and overall thresholds are enforced. The per-file threshold
# is 0, so no file fails on its own.
#
# An override or an exclude narrows what the coverage row holds to a
# threshold, and CODEOWNERS routes every change here to the code owner's
# review.

profile: coverage.out

# A coverage-ignore comment takes the code it marks out of the count, and
# this fails one that gives no reason beside the marker.
force-annotation-comment: true

threshold:
  # Per-file minimum. Files below this fail CI.
  file: 0

  # Per-package minimum.
  package: 80

  # Overall project minimum.
  total: 70

override:
  # cmd/ packages have CLI wiring that can't easily be unit tested.
  # Business logic lives in internal/.
  - threshold: 0
    path: ^cmd/

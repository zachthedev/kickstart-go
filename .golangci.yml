# The lint row and the fmt task pass --config .golangci.yml. It names every
# linter the row runs and every exclusion, and CODEOWNERS routes every change
# here to the code owner's review.
version: '2'

run:
  timeout: 3m

formatters:
  enable:
    - gofumpt
    - goimports

linters:
  default: none
  enable:
    # Bug detection
    - errcheck
    - errorlint
    - govet
    - staticcheck
    - ineffassign
    - bodyclose
    - durationcheck
    - nilerr
    - copyloopvar

    # Security
    - gosec

    # Style & consistency
    - misspell
    - unconvert
    - whitespace

    # Declaration ordering
    - decorder

    # Complexity
    - gocyclo
    - nestif

    # Waivers
    - nolintlint

  settings:
    nolintlint:
      # A //nolint names its linters and says why after a second //, and one
      # that waives nothing fails, so no waiver outlives the finding it covered.
      # The gate refuses the forms nolintlint does not read.
      require-specific: true
      require-explanation: true
      allow-unused: false
    gocyclo:
      # Safe baseline; raise for legitimately large functions (event loops,
      # single-pass parsers).
      min-complexity: 20
    nestif:
      # Safe baseline; raise for guard-heavy flows (state machines, signal dispatch).
      min-complexity: 6
    errcheck:
      check-type-assertions: true
      exclude-functions:
        # No-op once the transaction has committed or already rolled back.
        - (*database/sql.Tx).Rollback
    gosec:
      config:
        global:
          # A gosec waiver reads // #nosec G<nnn> -- reason. It waives the rules
          # it names and no other, and one without a rule or a reason waives
          # nothing. The gate refuses //nolint:gosec, which waives every rule,
          # and gosec:disable, which gosec reads as a second spelling.
          nosec-require-rules: true
          nosec-require-justification: true
      excludes:
        # Fires on idiomatic size conversions and protocol decodes. Drop for
        # crypto/auth-critical code where the noise cost is worth paying.
        - G115
    decorder:
      dec-order:
        - type
        - const
        - var
        - func
      disable-dec-order-check: false
      disable-init-func-first-check: false
      disable-dec-num-check: true # allow multiple const/var blocks (grouped by concern)
      ignore-underscore-vars: true
    govet:
      enable-all: true
      disable:
        # Struct-layout micro-optimization; change with profile evidence.
        - fieldalignment
        # Fires on idiomatic "if err := ...; err != nil"; noise > signal.
        - shadow

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - gocyclo
        path: _test\.go
      - linters:
          - gosec
        path: _test\.go
        text: 'G306'
